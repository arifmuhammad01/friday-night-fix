name: Build and Test

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build-test:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner information
        run: |
          echo "Running on self-hosted runner"
          hostname
          whoami
          uname -a

      - name: Check Node.js
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test